requirements:
  context.flow.user-input:
    - id: accept-user-input
      text: The system shall accept user input.
  pulse.behavior.process-input:
    - id: process-submitted-input
      text: The system shall process submitted input.
  pulse.domain-information.processed-result:
    - id: preserve-result-meaning
      text: The processed result shall preserve the domain meaning of the submitted input.
  ui.action.main.submit-input:
    - id: submit-input
      text: The user shall be able to submit input.
  ui.subview.shared-status:
    - id: reuse-shared-status
      text: Shared status shall be reusable across Views.
  ui.subview-action.shared-status.refresh-status:
    - id: refresh-shared-status
      text: The user shall be able to refresh shared status.
  ui.subview-info.shared-status.current-status:
    - id: show-shared-status
      text: Shared current status shall be visible.
  deployment.host.application-host:
    - id: use-linux-host
      text: The application shall run on a Linux host.
  deployment.program.example-application:
    - id: combine-server-and-web-ui
      text: The server and Web UI shall be delivered as one operating-system process.
  deployment.program.example-application.port.web:
    - id: listen-on-web-port
      text: The Web UI shall listen on port 8080.
  deployment.service.data-stack.database:
    - id: store-data-in-postgresql
      text: Persistent application data shall be stored in PostgreSQL.
  deployment.connection.application-database:
    - id: connect-over-internal-network
      text: The application shall connect to PostgreSQL over the internal deployment network.
