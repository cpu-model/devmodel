components:
  components:
    - id: result-processing
      name: Result Processing
      responsibility: Accept submitted input, establish the processed result and preserve its domain meaning.
      behaviors:
        - process-input
    - id: result-presentation
      name: Result Presentation
      responsibility: Present a valid processed result through the user-visible system behavior.
      behaviors:
        - present-result
      reconciliation:
        requires:
          - result-processing
    - id: runtime-composition
      name: Runtime Composition
      responsibility: Compose the server and Web UI into the required operating-system process while preserving functional Component authority.
      kind: infrastructure
      behaviors: []
      requirement-evidence:
        - combine-server-and-web-ui
  domain-information:
    - id: submitted-input
      disposition: external-input
    - id: processed-result
      authority: result-processing
