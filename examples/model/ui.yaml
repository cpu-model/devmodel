ui:
  subviews:
    - id: navigation
      name: Navigation
      navigation:
        - to: main
        - to: details
    - id: shared-status
      name: Shared status
      actions:
        - id: refresh-status
          name: Refresh status
      information:
        - id: current-status
          name: Current status
          fields:
            - id: state
              name: State
            - id: observed-at
              name: Observed at
      composition:
        - id: status
          content:
            - current-status
            - refresh-status
  views:
    - id: main
      name: Main
      includes:
        - navigation
        - shared-status
      actions:
        - id: submit-input
          name: Submit input
      information:
        - id: current-status
          name: Current status
          fields:
            - id: state
              name: State
            - id: observed-at
              name: Observed at
      composition:
        - id: header
          content:
            - navigation
        - id: workspace
          content:
            - shared-status
            - id: summary-status
              ref: current-status
            - id: detailed-status
              ref: current-status
            - submit-input
    - id: details
      name: Details
      includes:
        - navigation
      information:
        - id: details
          name: Details
          multiple: true
      composition:
        - id: header
          content:
            - navigation
        - id: workspace
          content:
            - details
