name: Review devmodel reference model

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - AGENTS.md
      - SPEC.md
      - CPU/PROCESS/**
      - examples/model/**
      - tools/**
      - tests/**
      - package.json
      - package-lock.json
      - .github/workflows/render-devmodel-review.yml

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout devmodel
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test devmodel
        run: npm test

      - name: Validate reference model
        run: npm run validate -- --source examples/model

      - name: Render reference model review
        run: npm run render -- --source examples/model --out examples/model

      - name: Commit changed reference diagrams
        run: |
          git add examples/model/context.pdf examples/model/pulse.pdf examples/model/ui.pdf examples/model/deployment.pdf
          if git diff --cached --quiet; then
            echo "Reference diagrams are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Render devmodel reference diagrams"
          git push
