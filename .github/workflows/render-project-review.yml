name: Render CPU review

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - CPU/context.yaml
      - CPU/pulse.yaml
      - CPU/ui.yaml
      - CPU/deployment.yaml
      - CPU/requirements.yaml
      - .github/workflows/render-cpu-review.yml
      - .github/review-trigger

permissions:
  contents: write

jobs:
  render:
    if: github.repository != 'cpu-model/devmodel'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v6
        with:
          path: project

      - name: Checkout current devmodel
        uses: actions/checkout@v6
        with:
          repository: cpu-model/devmodel
          path: devmodel

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: devmodel/package-lock.json

      - name: Install devmodel dependencies
        working-directory: devmodel
        run: npm ci

      - name: Test devmodel
        working-directory: devmodel
        run: npm test

      - name: Validate project model
        working-directory: devmodel
        run: npm run validate -- --source ../project/CPU

      - name: Render project review
        working-directory: devmodel
        run: npm run render -- --source ../project/CPU --out ../project/CPU

      - name: Commit changed review artifacts
        working-directory: project
        run: |
          if git diff --quiet -- CPU/context.pdf CPU/pulse.pdf CPU/ui.pdf CPU/deployment.pdf && [ -z "$(git status --porcelain --untracked-files=all CPU/*.pdf)" ]; then
            echo "CPU diagrams are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CPU/context.pdf CPU/pulse.pdf CPU/ui.pdf CPU/deployment.pdf
          git commit -m "Render CPU model review"
          git push
