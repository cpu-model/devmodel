name: Render CPU review

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - CPU/context.yaml
      - CPU/pulse.yaml
      - CPU/ui.yaml
      - CPU/deployment.yaml
      - CPU/requirements.yaml

permissions:
  contents: write

jobs:
  render:
    if: github.repository != 'cpu-model/devmodel'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v6
        with:
          path: project

      - name: Checkout current devmodel
        uses: actions/checkout@v6
        with:
          repository: cpu-model/devmodel
          path: devmodel

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: devmodel/package-lock.json

      - name: Install devmodel dependencies
        working-directory: devmodel
        run: npm ci

      - name: Install D2 0.9.0
        run: |
          curl -fsSL https://d2lang.com/install.sh | sh -s -- --version v0.9.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Test devmodel
        working-directory: devmodel
        run: npm test

      - name: Validate project model
        working-directory: devmodel
        run: npm run validate -- --source ../project/CPU

      - name: Render project review
        working-directory: devmodel
        env:
          CPU_REVIEW_BROWSER: /usr/bin/google-chrome
        run: npm run render -- --source ../project/CPU --out ../project/CPU/review --review-title "${{ github.event.repository.name }} model review"

      - name: Commit changed review artifacts
        working-directory: project
        run: |
          if git diff --quiet -- CPU/review && [ -z "$(git status --porcelain --untracked-files=all CPU/review)" ]; then
            echo "CPU/review is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CPU/review
          git commit -m "Render CPU model review"
          git push
